name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: 真实站点联调测试
    runs-on: ubuntu-latest
    continue-on-error: true # 源站在 CI 网络下偶发超时不阻断部署
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 真实站点联调测试
        id: test
        run: |
          if npm test; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            # fofoys 对境外 IP 返回 403，GitHub runner 在美国会被源站拒绝——
            # 这类失败以 warning 形式提示，不把整个 workflow 打成红叉
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::联调测试存在失败项（fofoys 对境外 IP 403 属已知现象，可用 TVBOX_API_BASE 远程模式复测）"
          fi

  deploy-workers:
    name: 部署到 Cloudflare Workers
    runs-on: ubuntu-latest
    needs: test
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # 没配置 Cloudflare Secrets 时优雅跳过，不让仓库挂红叉
      - name: 检查 Cloudflare 凭据
        id: check
        run: |
          if [ -n "$CF_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，跳过部署（接口已通过 wrangler 手动部署上线）"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22

      - run: npm install
        if: steps.check.outputs.ready == 'true'

      - uses: cloudflare/wrangler-action@v3
        if: steps.check.outputs.ready == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  # 如需同时发布到 Pages，先在 Cloudflare 建好同名 Pages 项目，再取消下面的注释
